<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Page not found — Worklog Appendix</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #10233b;
        color: #f6f7f2;
        font: 18px system-ui;
        padding: 0 2rem;
      }
      header,
      main,
      footer {
        max-width: 960px;
        margin: auto;
      }
      .skip {
        position: absolute;
        transform: translateY(-150%);
        background: #fff;
        color: #10233b;
        padding: 0.7rem;
      }
      .skip:focus {
        transform: translateY(0);
      }
      header {
        padding: 1.5rem 0;
        border-bottom: 1px solid #55758a;
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
      }
      nav {
        display: flex;
        gap: 0.5rem 1rem;
        flex-wrap: wrap;
      }
      main {
        padding: 6rem 0;
        max-width: 35rem;
      }
      .dot {
        display: block;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #ffb44a;
        box-shadow: 0 0 28px #ffb44a;
        margin-bottom: 2rem;
      }
      a {
        color: #fff;
        display: inline-flex;
        align-items: center;
        min-width: 44px;
        min-height: 44px;
        padding: 0.25rem;
      }
      a:focus-visible {
        outline: 3px solid #ffb44a;
        outline-offset: 3px;
      }
      footer {
        border-top: 1px solid #55758a;
        padding: 1.5rem 0;
        font-size: 0.85rem;
        color: #c4d9dd;
      }
      @media (max-width: 390px) {
        body { padding: 0 1rem; }
        main { padding: 4rem 0; }
      }
    </style>
  </head>
  <body>
    <a class="skip" href="#main">Skip to main content</a>
    <header>
      <a href="/">Worklog Appendix</a>
      <nav aria-label="Main navigation">
        <a href="/demo">Demo</a><a href="/privacy">Privacy</a
        ><a href="/terms">Terms</a>
      </nav>
    </header>
    <main id="main" tabindex="-1">
      <i class="dot" aria-hidden="true"></i>
      <h1>Page not found</h1>
      <p>This address does not have a Worklog Appendix page.</p>
      <a href="/">Go to Worklog Appendix</a>
    </main>
    <footer>
      Clear work evidence for client invoices. ·
      <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a> · Built by
      Param Factory · v1.0.1
    </footer>
  </body>
</html>
